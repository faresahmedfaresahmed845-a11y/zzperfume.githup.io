<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<title>Z.Z PERFUME</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
  text-align: center;
}
header {
  padding: 40px 20px;
}
header h1 {
  color: gold;
  letter-spacing: 3px;
}
.products {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  padding: 20px;
}
.product {
  background: #1a1a1a;
  padding: 15px;
  border-radius: 10px;
}
.product img {
  width: 100%;
  border-radius: 10px;
}
button {
  background: gold;
  border: none;
  padding: 10px;
  margin-top: 10px;
  width: 100%;
  font-weight: bold;
  cursor: pointer;
}
footer {
  padding: 20px;
  color: gray;
}
</style>
</head>

<body>

<header>
  <h1>Z.Z PERFUME</h1>
  <p>Luxury Fragrances</p>
</header>

<section class="products">
  <div class="product">
    <img src="https://via.placeholder.com/300x300" alt="Perfume">
    <h3>Perfume One</h3>
    <p>500 EGP</p>
    <a href="https://wa.me/201234567890?text=عايز اطلب Perfume One">
      <button>اطلب الآن</button>
    </a>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300x300" alt="Perfume">
    <h3>Perfume Two</h3>
    <p>650 EGP</p>
    <a href="https://wa.me/201234567890?text=عايز اطلب Perfume Two">
      <button>اطلب الآن</button>
    </a>
  </div>
</section>

<footer>
  © 2025 Z.Z PERFUME
</footer>

</body>
</html>
